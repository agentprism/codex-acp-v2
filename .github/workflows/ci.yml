name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  style:
    name: Formatting and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: rustup show
      - run: cargo fmt --all --check
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Verify release tooling
        run: python -m unittest discover --start-directory scripts --pattern '*_tests.py'

  rust:
    name: Rust (${{ matrix.target }})
    needs: supply-chain
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: X64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: ARM64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: ARM64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: X64
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      BUILD_TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify native architecture
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add "$BUILD_TARGET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ matrix.target }}/debug
          key: rust-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - run: cargo check --locked --all-targets --target "$BUILD_TARGET"
      - run: cargo clippy --locked --all-targets --target "$BUILD_TARGET" -- -D warnings
      - run: cargo test --locked --all-targets --target "$BUILD_TARGET"
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --target "$BUILD_TARGET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/backend-downloads
          key: backend-${{ matrix.target }}-${{ hashFiles('backend.lock.json') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-notices
      - name: Stage the complete pinned backend
        run: python scripts/backend.py --target "$BUILD_TARGET" --destination "target/$BUILD_TARGET/release/codex"
      - name: Build and verify the standalone self-extracting executable
        run: |
          PACKAGE_TAG="v$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python scripts/release.py build --tag "$PACKAGE_TAG" --target "$BUILD_TARGET" --check
          if [ "$BUILD_TARGET" = x86_64-unknown-linux-musl ]; then
            python scripts/release.py verify --tag "$PACKAGE_TAG" --target "$BUILD_TARGET" --deep
          else
            python scripts/release.py verify --tag "$PACKAGE_TAG" --target "$BUILD_TARGET"
          fi

  backend-sources:
    name: Backend corresponding sources and offline rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned upstream compiler and source-build prerequisites
        run: |
          BACKEND_RUST="$(python -c 'import json; print(json.load(open("backend.lock.json"))["rebuild"]["rustToolchain"])')"
          rustup toolchain install "$BACKEND_RUST" --profile minimal
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gperf pkg-config build-essential
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            target/backend-downloads
          key: backend-sources-audit-0.22.2-${{ hashFiles('backend.lock.json') }}
      - name: Install pinned report-only backend audit tool
        run: |
          if [ "$(cargo-audit --version 2>/dev/null || true)" != 'cargo-audit 0.22.2' ]; then
            cargo install --locked --force cargo-audit --version 0.22.2
          fi
          test "$(cargo-audit --version)" = 'cargo-audit 0.22.2'
      - name: Assemble complete corresponding sources and rebuild bwrap offline
        run: python scripts/backend_sources.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-rustsec-report
          path: target/backend-audit-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sources
          path: dist/codex-backend-sources-*.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  supply-chain:
    name: Dependency security and licenses
    uses: ./.github/workflows/security.yml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  passed:
    name: CI passed
    if: always()
    needs: [style, rust, supply-chain, backend-sources, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          STYLE_RESULT: ${{ needs.style.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          BACKEND_SOURCES_RESULT: ${{ needs.backend-sources.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$STYLE_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$BACKEND_SOURCES_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
