[package]
name = "codex-acp-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "ACP v2 agent server backed by the Codex app-server"
publish = false

[dependencies]
agent-client-protocol = { version = "=2.1.0", features = ["unstable_protocol_v2", "unstable_session_fork"] }
anyhow = "1"
base64 = "0.22"
blocking = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
